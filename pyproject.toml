[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amadeus-memory-mcp"
version = "0.1.0"
description = "One MCP server for semantic fact memory (mem0) and a code knowledge graph (codebase-memory), with cross-linked recall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tonpa" }]
keywords = ["mcp", "mem0", "codebase-memory", "knowledge-graph", "memory", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # Pinned to the 1.x API: in MCP SDK 2.x FastMCP was renamed to MCPServer and
  # the tool/context APIs changed (see the SDK's v2 migration guide).
  "mcp>=1.9,<2",
  "mem0ai>=2.2",
  "qdrant-client>=1.14",
  "fastembed>=0.9",
  "loguru>=0.7",
]

[project.optional-dependencies]
# NOTE: there is no "upstream" extra on purpose. The upstream LOCAL-store mem0
# MCP module (Apache-2.0) is installed from git, not from PyPI:
#   pip install "git+https://github.com/zfy258/mem0-mcp-server.git"
# The PyPI distribution of the same name (0.2.x) is a HOSTED-API client with a
# different contract; the package detects it and uses the direct mem0ai path
# instead (see amadeus_memory.store). An extra cannot express the git URL
# because PyPI rejects direct references in dependencies.

[project.scripts]
amadeus-memory-mcp = "amadeus_memory.server:main"

[project.urls]
Homepage = "https://github.com/tonpai1007/amadeus-memory-mcp"
Repository = "https://github.com/tonpai1007/amadeus-memory-mcp"
Issues = "https://github.com/tonpai1007/amadeus-memory-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus_memory"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "PL", "BLE", "RUF"]
ignore = [
  "E501",    # long lines are readable here (prompt strings, error payloads)
  "BLE001",  # blind excepts are deliberate: a failing memory/graph call must
             # never take the tool (or the server) down — every call site logs.
  "PLC0415", # lazy imports are deliberate (optional deps, heavy modules)
  "PLW0603", # module-level singletons (the warm graph child, project cache)
  "S603",    # subprocess calls only ever target a resolved, trusted binary
  "SIM115",  # short-lived temp-file reads (closed immediately afterwards)
  "PLR0913", # MCP tool schemas mirror the underlying API surface, which has
  "PLR0917", # many optional filters — one parameter per API field is the point
]

[tool.ruff.lint.per-file-ignores]
# The tool dispatcher has one return per tool case, and the smoke test is a
# flat list of assertions — both are clearer than the abstractions the rules
# would push towards.
"src/amadeus_memory/store.py" = ["PLR0911"]
"tests/smoke_test.py" = ["PLR0912"]
